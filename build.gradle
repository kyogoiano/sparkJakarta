group = 'com.sparkjava'
version = System.properties.getProperty('version', '0.0.0') + "-SNAPSHOT"

buildscript {
    ext.jettyVersion = '12.0.40'
    ext.mockitoVersion = '5.24.0'
    ext.slf4jVersion = '2.0.20'
    ext.junitVersion = '6.1.3'
    repositories {
        mavenCentral()
        maven {
            url = "https://plugins.gradle.org/m2/"
        }
    }
}
apply plugin: 'java'

repositories {
    mavenCentral()
}


configurations {
    mockitoAgent
}

dependencies {
    implementation "org.slf4j:slf4j-api:$slf4jVersion"
    implementation "org.slf4j:slf4j-simple:$slf4jVersion"
    testImplementation "org.slf4j:slf4j-api:$slf4jVersion"
    testImplementation "org.slf4j:slf4j-simple:$slf4jVersion"

    implementation "org.eclipse.jetty:jetty-server:$jettyVersion"
    implementation "org.eclipse.jetty.ee10:jetty-ee10-webapp:$jettyVersion"
    implementation "org.eclipse.jetty.ee10.websocket:jetty-ee10-websocket-jetty-server:$jettyVersion"// https://mvnrepository.com/artifact/org.eclipse.jetty.ee9.websocket/jetty-ee9-websocket-jakarta-server
    implementation "org.eclipse.jetty.ee10.websocket:jetty-ee10-websocket-jakarta-server:$jettyVersion"
    implementation "jakarta.websocket:jakarta.websocket-api:2.0.0"

    implementation "org.eclipse.jetty.websocket:jetty-websocket-jetty-api:$jettyVersion"
    implementation "org.eclipse.jetty.websocket:jetty-websocket-jetty-server:$jettyVersion"
    implementation "org.eclipse.jetty.websocket:jetty-websocket-core-server:$jettyVersion"

    testImplementation "net.bytebuddy:byte-buddy:1.18.15"
    testImplementation "net.bytebuddy:byte-buddy-agent:1.18.15"
    mockitoAgent("net.bytebuddy:byte-buddy-agent:1.18.15") { transitive = false }
    testImplementation "org.mockito:mockito-core:$mockitoVersion"
    testImplementation "org.mockito:mockito-junit-jupiter:$mockitoVersion"
    testImplementation "org.junit.jupiter:junit-jupiter-api:$junitVersion"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:$junitVersion"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:$junitVersion"

    testImplementation 'org.hamcrest:hamcrest:3.0'
    testImplementation 'org.apache.commons:commons-lang3:3.21.0'

    testImplementation 'org.apache.httpcomponents.client5:httpclient5:5.6.5'
    testImplementation 'org.freemarker:freemarker:2.3.35'
    testImplementation "com.google.code.gson:gson:2.14.0"
    testImplementation "org.eclipse.jetty.ee10.websocket:jetty-ee10-websocket-jakarta-client:$jettyVersion"
    implementation 'org.jetbrains:annotations:26.1.0'

}

test {

//    useJUnitJupiter()

    forkEvery = 1
    maxParallelForks = 1
    useJUnitPlatform()
    failFast = true
    reports {

    }
    jvmArgs("-javaagent:${configurations.mockitoAgent.asPath}", "-Dnet.bytebuddy.experimental=true")
    //jvmArgs['--add-modules java.se --add-exports java.base/jdk.internal.ref=EVERYONE --add-opens java.base/java.lang=EVERYONE --add-opens java.base/java.nio=EVERYONE --add-opens java.base/sun.nio.ch=EVERYONE --add-opens java.management/sun.management=EVERYONE --add-opens jdk.management/com.sun.management.internal=EVERYONE --add-opens java.base/java.lang.reflect=test']

}
